name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: evaluate mochi
        run: nix eval .#nixosConfigurations.mochi.config.system.build.toplevel.drvPath

      - name: check flake outputs
        run: nix flake check --no-build
